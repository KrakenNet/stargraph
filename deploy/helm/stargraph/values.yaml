# SPDX-License-Identifier: Apache-2.0
# Minimal values for the Stargraph chart. There is deliberately no
# replicaCount knob: the StatefulSet is pinned to 1 replica (see README —
# single-process audit-chain invariant).

image:
  repository: stargraph
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# Deployment profile passed to `stargraph serve --profile`.
profile: oss-default

service:
  type: ClusterIP
  port: 8000

persistence:
  # PVC for /data (SQLite checkpointer + JSONL audit log). Must be
  # backed by a POSIX-local filesystem — the checkpointer refuses
  # NFS/SMB mounts at bootstrap.
  size: 1Gi
  # Empty string uses the cluster default StorageClass.
  storageClassName: ""

resources: {}
  # requests:
  #   cpu: 250m
  #   memory: 512Mi
  # limits:
  #   memory: 1Gi

# Extra environment variables for the serve container.
extraEnv: []
  # - name: STARGRAPH_PROFILE
  #   value: cleared
